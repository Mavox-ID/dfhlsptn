<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, unavailable_after: 1-Jan-2099">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="yandex" content="noindex, nofollow">
    <title>DFHLSPTN</title>
    <link rel="icon" type="image/png" sizes="512x512" href="icon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            font-family: sans-serif;
        }

        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 9999;
            cursor: pointer;
        }

        #main-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center;
            display: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="start-overlay"></div>
    <video id="main-video" loop playsinline preload="auto">
        <source src="video.mp4" type="video/mp4">
    </video>

    <script>
        const overlay = document.getElementById('start-overlay');
        const video = document.getElementById('main-video');

        function enableFullScreen() {
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(() => {});
            } else if (docEl.webkitRequestFullscreen) { /* Safari / iOS */
                docEl.webkitRequestFullscreen();
            } else if (docEl.msRequestFullscreen) { /* IE11 */
                docEl.msRequestFullscreen();
            }
        }

        function startPlayback() {
            enableFullScreen();
            video.style.display = 'block';
            video.muted = false;
            video.volume = 1.0;

            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                }).catch(error => {
                });
            }

            overlay.style.display = 'none';
            document.removeEventListener('click', startPlayback);
            document.removeEventListener('touchstart', startPlayback);
        }

        document.addEventListener('click', startPlayback, { once: true });
        document.addEventListener('touchstart', startPlayback, { once: true });
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (event.ctrlKey && (event.key === 'u' || event.key === 's')) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
